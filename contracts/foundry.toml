[profile.default]
src = 'contracts'
out = 'out'
test = 'test-forge'
# Upstream's in-source TestBytesUtils.sol uses the legacy testFail* convention
# removed in Foundry 1.x; excluded here rather than modifying upstream files.
# Its behaviours are covered by the upstream Hardhat suite.
no_match_test = '^testFail'
libs = ['node_modules', 'lib']
solc_version = '0.8.26'
evm_version = 'paris'
optimizer = true
optimizer_runs = 1200
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

# Blockscout verification (forge script --verify / forge verify-contract)
[etherscan]
robinhood = { key = "verifyContract", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
robinhood-testnet = { key = "verifyContract", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api" }
